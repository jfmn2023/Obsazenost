name: Wellness Capacity Check

on:
  schedule:
    # Every 30 min from 14:05 to 18:35 UTC (15:05 to 19:35 CET)
    - cron: '10,40 14-18 * * *'
    # Final run at 19:05 UTC (20:05 CET)
    - cron: '10 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run wellness script
        run: python skript.py

      - name: Commit and push CSV history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git add wellness_history.csv
          if ! git diff --staged --quiet; then
            git commit -m "Update wellness history $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
